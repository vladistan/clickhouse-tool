[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clickhouse-tool"
dynamic = ["version"]
description = "ClickHouse query and administration CLI tool for the OTel logs/metrics pilot"
readme = "README.md"
authors = [
  {name = "Vlad Korolev", email = "vlad@v-lad.org"}
]
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.5.0",
  "rich>=13.0.0",
  "structlog>=24.0",
  "sentry-sdk>=1.40.0",
  "boto3>=1.34.0"
]

[project.optional-dependencies]
native = [
  "clickhouse-driver>=0.2.9"
]
http = [
  "clickhouse-connect>=0.7.0"
]
all = [
  "clickhouse-tool[native]",
  "clickhouse-tool[http]"
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4.0"
]

[project.scripts]
clickhouse-tool = "clickhouse_tool.cli.main:run"

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod"
]

[tool.coverage.run]
source = ["src"]
omit = [
  "*/tests/*",
  "*/test_*.py",
  "*/__about__.py"
]

[tool.hatch.build.targets.wheel]
packages = ["src/clickhouse_tool"]

[tool.hatch.version]
path = "src/clickhouse_tool/__about__.py"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["clickhouse_driver.*", "clickhouse_connect.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--cov=clickhouse_tool",
  "--cov-report=term-missing",
  "--cov-report=html:htmlcov",
  "--cov-report=xml",
  "--cov-fail-under=80"
]
markers = [
  "unit: marks tests as unit tests (fast, no external dependencies)",
  "integration: marks tests as integration tests (requires the real ClickHouse pilot)",
  "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]
filterwarnings = [
  "error",
  "ignore::UserWarning",
  "ignore::DeprecationWarning"
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "N",
  "W",
  "UP",
  "B",
  "C4",
  "SIM",
  "PTH",
  "RUF",
  "S"
]
ignore = [
  "E501",
  "B008",
  "N818" # exception names are the plan's pinned contract (AuthFailed, QueryTimeout, ...)
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["clickhouse_tool"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101"]
